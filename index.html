<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acompanhamento de Metas</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Material Symbols Outlined Font -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <!-- Google Fonts - Roboto -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" />
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- SortableJS for Drag and Drop -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Roboto', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <style>
    /* Custom Scrollbar for sleek Android look */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(150, 150, 150, 0.3);
      border-radius: 999px;
    }
    .tap-highlight-transparent {
      -webkit-tap-highlight-color: transparent;
    }
    /* Smooth transition for progress bar stroke fill */
    .progress-bar-fill {
      transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.4s ease;
    }
    /* Ring pulse animation when reaching 100% */
    @keyframes ringPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    .animate-ring-pulse {
      animation: ringPulse 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .sortable-ghost {
      opacity: 0.4;
      background-color: rgba(103, 80, 164, 0.1) !important;
    }
    .sortable-drag {
      cursor: grabbing !important;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.2) !important;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-zinc-950 text-slate-900 dark:text-zinc-100 min-h-full font-sans pb-24 antialiased selection:bg-purple-500 selection:text-white">

  <!-- Header App Bar -->
  <header class="sticky top-0 z-30 bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md border-b border-slate-200 dark:border-zinc-800 px-4 py-3">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-purple-600 flex items-center justify-center text-white shadow-md shadow-purple-600/30">
          <span class="material-symbols-outlined text-2xl">published_with_changes</span>
        </div>
        <div>
          <h1 class="text-lg font-bold leading-tight text-slate-800 dark:text-zinc-100">Minhas Metas</h1>
          <p class="text-xs text-slate-500 dark:text-zinc-400">Progresso & Objetivos</p>
        </div>
      </div>
      
      <div class="flex items-center gap-1">
        <button onclick="openCategoryModal()" class="p-2 text-slate-600 dark:text-zinc-400 hover:bg-slate-100 dark:hover:bg-zinc-800 rounded-full transition-colors tap-highlight-transparent" title="Gerenciar Categorias">
          <span class="material-symbols-outlined">label</span>
        </button>
        <button onclick="toggleTheme()" class="p-2 text-slate-600 dark:text-zinc-400 hover:bg-slate-100 dark:hover:bg-zinc-800 rounded-full transition-colors tap-highlight-transparent" title="Alternar Tema">
          <span class="material-symbols-outlined dark:hidden">dark_mode</span>
          <span class="material-symbols-outlined hidden dark:block">light_mode</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 pt-4 space-y-4">
    <!-- Filters Bar -->
    <div class="space-y-3">
      <!-- Status Tabs -->
      <div class="flex bg-slate-200/80 dark:bg-zinc-900 p-1 rounded-2xl text-xs font-medium">
        <button data-status="pending" class="status-filter flex-1 py-2 rounded-xl transition-all duration-200 bg-purple-600 text-white shadow-sm font-semibold">
          Em Andamento
        </button>
        <button data-status="completed" class="status-filter flex-1 py-2 rounded-xl transition-all duration-200 text-slate-600 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-zinc-200">
          Concluídas
        </button>
        <button data-status="all" class="status-filter flex-1 py-2 rounded-xl transition-all duration-200 text-slate-600 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-zinc-200">
          Todas
        </button>
      </div>

      <!-- Category Filter Pills -->
      <div id="category-pills" class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- Goals List Container -->
    <div id="goals-list" class="space-y-3">
      <!-- Rendered dynamically -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden flex flex-col items-center justify-center py-16 text-center px-4">
      <div class="w-16 h-16 rounded-full bg-slate-100 dark:bg-zinc-800/60 flex items-center justify-center text-slate-400 dark:text-zinc-500 mb-3">
        <span class="material-symbols-outlined text-3xl">task</span>
      </div>
      <h3 class="text-base font-semibold text-slate-700 dark:text-zinc-300">Nenhuma meta encontrada</h3>
      <p class="text-xs text-slate-500 dark:text-zinc-500 max-w-xs mt-1">
        Crie uma nova meta clicando no botão abaixo para começar a acompanhar seu progresso!
      </p>
    </div>
  </main>

  <!-- Floating Action Button (FAB) -->
  <button onclick="openGoalModal()" class="fixed bottom-6 right-6 bg-purple-600 hover:bg-purple-700 active:scale-95 text-white p-4 rounded-2xl shadow-lg shadow-purple-600/30 flex items-center gap-2 font-medium text-sm transition-all z-20 tap-highlight-transparent">
    <span class="material-symbols-outlined text-2xl">add</span>
    <span class="hidden sm:inline pr-1">Nova Meta</span>
  </button>

  <!-- Goal Modal -->
  <div id="goal-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
    <div class="bg-white dark:bg-zinc-900 w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-zinc-800">
        <h2 id="modal-title" class="text-lg font-bold text-slate-800 dark:text-zinc-100">Nova Meta</h2>
        <button onclick="closeGoalModal()" class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-zinc-200 rounded-full">
          <span class="material-symbols-outlined text-2xl">close</span>
        </button>
      </div>

      <form id="goal-form" class="mt-4 space-y-4 overflow-y-auto pr-1 flex-1">
        <input type="hidden" id="modal-goal-id">
        
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 dark:text-zinc-400 mb-1">Título da Meta</label>
          <input type="text" id="goal-title" required placeholder="Ex: Ler 12 livros no ano" class="w-full px-3.5 py-2.5 bg-slate-100 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm text-slate-900 dark:text-zinc-100">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 dark:text-zinc-400 mb-1">Descrição (Opcional)</label>
          <textarea id="goal-desc" rows="2" placeholder="Detalhes adicionais sobre esse objetivo..." class="w-full px-3.5 py-2.5 bg-slate-100 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm text-slate-900 dark:text-zinc-100 resize-none"></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 dark:text-zinc-400 mb-1">Categoria</label>
            <select id="goal-category" class="w-full px-3.5 py-2.5 bg-slate-100 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm text-slate-900 dark:text-zinc-100">
              <!-- Rendered dynamically -->
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 dark:text-zinc-400 mb-1">Data Limite (Opcional)</label>
            <input type="date" id="goal-deadline" class="w-full px-3.5 py-2.5 bg-slate-100 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm text-slate-900 dark:text-zinc-100">
          </div>
        </div>

        <!-- Tasks Checklist inside goal -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="block text-xs font-semibold uppercase text-slate-500 dark:text-zinc-400">Tarefas / Passos</label>
            <button type="button" onclick="addModalTaskInput()" class="text-xs text-purple-600 dark:text-purple-400 font-semibold hover:underline flex items-center gap-0.5">
              <span class="material-symbols-outlined text-sm">add</span> Adicionar Passo
            </button>
          </div>
          <div id="modal-tasks-container" class="space-y-2">
            <!-- Dynamic task input rows -->
          </div>
        </div>

        <div class="pt-4 flex items-center justify-end gap-2 border-t border-slate-100 dark:border-zinc-800">
          <button type="button" onclick="closeGoalModal()" class="px-4 py-2.5 text-xs font-semibold text-slate-600 dark:text-zinc-400 hover:bg-slate-100 dark:hover:bg-zinc-800 rounded-xl transition-colors">
            Cancelar
          </button>
          <button type="submit" class="px-5 py-2.5 text-xs font-semibold text-white bg-purple-600 hover:bg-purple-700 rounded-xl shadow-md transition-all">
            Salvar Meta
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Category Manager Modal -->
  <div id="category-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 transition-opacity">
    <div class="bg-white dark:bg-zinc-900 w-full max-w-md rounded-3xl p-6 shadow-2xl flex flex-col">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-zinc-800">
        <h2 class="text-lg font-bold text-slate-800 dark:text-zinc-100">Gerenciar Categorias</h2>
        <button onclick="closeCategoryModal()" class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-zinc-200 rounded-full">
          <span class="material-symbols-outlined text-2xl">close</span>
        </button>
      </div>

      <form id="category-form" class="mt-4 flex gap-2">
        <input type="text" id="new-cat-name" required placeholder="Nova Categoria..." class="flex-1 px-3.5 py-2 bg-slate-100 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 text-xs text-slate-900 dark:text-zinc-100">
        <input type="color" id="new-cat-color" value="#6750A4" class="w-10 h-9 p-1 bg-slate-100 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-xl cursor-pointer">
        <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-purple-600 hover:bg-purple-700 rounded-xl transition-colors">
          Criar
        </button>
      </form>

      <div id="category-list" class="mt-4 space-y-2 max-h-60 overflow-y-auto pr-1">
        <!-- Rendered dynamically -->
      </div>

      <div class="mt-4 pt-3 border-t border-slate-100 dark:border-zinc-800 text-right">
        <button onclick="closeCategoryModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 dark:text-zinc-400 hover:bg-slate-100 dark:hover:bg-zinc-800 rounded-xl">
          Fechar
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- Global State ---
    let goals = [];
    let categories = [
      { id: 'work', name: 'Trabalho', color: '#6750A4' },
      { id: 'personal', name: 'Pessoal', color: '#7D5260' },
      { id: 'study', name: 'Estudos', color: '#00658F' },
      { id: 'health', name: 'Saúde', color: '#1A6C39' }
    ];
    let currentCategoryFilter = 'all';
    let currentStatusFilter = 'pending'; // 'all', 'pending', 'completed'
    let sortableInstance = null;

    // --- Local Storage Management ---
    function loadData() {
      const savedGoals = localStorage.getItem('app_goals');
      const savedCategories = localStorage.getItem('app_categories');

      if (savedGoals) {
        try {
          goals = JSON.parse(savedGoals);
        } catch(e) { console.error('Error loading goals', e); }
      }

      if (savedCategories) {
        try {
          categories = JSON.parse(savedCategories);
        } catch(e) { console.error('Error loading categories', e); }
      }
    }

    function saveData() {
      localStorage.setItem('app_goals', JSON.stringify(goals));
      localStorage.setItem('app_categories', JSON.stringify(categories));
    }

    // --- Theme (Dark/Light) Initialization & Toggle ---
    function initTheme() {
      const savedTheme = localStorage.getItem('app_theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('app_theme', isDark ? 'dark' : 'light');
    }

    // --- Helpers ---
    function calculateGoalProgress(goal) {
      if (!goal.tasks || goal.tasks.length === 0) return 0;
      const completed = goal.tasks.filter(t => t.completed).length;
      return Math.round((completed / goal.tasks.length) * 100);
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      if (isNaN(date.getTime())) return dateStr;
      return date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function formatDateTime(dateTimeStr) {
      if (!dateTimeStr) return '';
      const date = new Date(dateTimeStr);
      if (isNaN(date.getTime())) return dateTimeStr;
      return date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    // --- Rendering UI ---
    function renderCategoryFilters() {
      const container = document.getElementById('category-pills');
      if (!container) return;

      let html = `
        <button onclick="selectCategory('all')" class="category-pill flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium transition-colors ${currentCategoryFilter === 'all' ? 'bg-purple-600 text-white' : 'bg-slate-200 dark:bg-zinc-800 text-slate-700 dark:text-zinc-300'}">
          Todas
        </button>
      `;

      categories.forEach(cat => {
        const isSelected = currentCategoryFilter === cat.id;
        html += `
          <button onclick="selectCategory('${cat.id}')" class="category-pill flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium transition-colors ${isSelected ? 'bg-purple-600 text-white' : 'bg-slate-200 dark:bg-zinc-800 text-slate-700 dark:text-zinc-300'}">
            <span class="w-2 h-2 rounded-full" style="background-color: ${cat.color}"></span>
            ${cat.name}
          </button>
        `;
      });

      container.innerHTML = html;
    }

    function selectCategory(catId) {
      currentCategoryFilter = catId;
      renderCategoryFilters();
      renderGoals();
    }

    function renderGoals() {
      const listEl = document.getElementById('goals-list');
      const emptyStateEl = document.getElementById('empty-state');
      if (!listEl) return;

      // Filter goals
      let filtered = goals.filter(goal => {
        const progress = calculateGoalProgress(goal);
        const isCompleted = progress === 100;

        // Status Filter
        if (currentStatusFilter === 'pending' && isCompleted) return false;
        if (currentStatusFilter === 'completed' && !isCompleted) return false;

        // Category Filter
        if (currentCategoryFilter !== 'all' && goal.categoryId !== currentCategoryFilter) return false;

        return true;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = '';
        if (emptyStateEl) emptyStateEl.classList.remove('hidden');
        return;
      }

      if (emptyStateEl) emptyStateEl.classList.add('hidden');

      const radius = 28;
      const circumference = 2 * Math.PI * radius;

      listEl.innerHTML = filtered.map(goal => {
        const category = categories.find(c => c.id === goal.categoryId) || { name: 'Geral', color: '#6750A4' };
        const progress = calculateGoalProgress(goal);
        const isCompleted = progress === 100;
        const strokeDashoffset = circumference - (progress / 100) * circumference;

        return `
          <div data-id="${goal.id}" class="goal-card bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl p-4 transition-all duration-200 hover:shadow-md">
            <div class="flex items-start justify-between gap-3">
              <!-- Drag Handle -->
              <div class="drag-handle cursor-grab active:cursor-grabbing text-slate-400 dark:text-zinc-600 mt-1 select-none">
                <span class="material-symbols-outlined text-xl">drag_indicator</span>
              </div>

              <!-- Goal Meta & Info -->
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1 flex-wrap">
                  <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-md text-white" style="background-color: ${category.color}">
                    ${category.name}
                  </span>
                  ${goal.deadline ? `
                    <span class="text-xs text-slate-500 dark:text-zinc-400 flex items-center gap-1">
                      <span class="material-symbols-outlined text-sm">calendar_today</span>
                      ${formatDate(goal.deadline)}
                    </span>
                  ` : ''}
                </div>
                <h3 class="font-bold text-base text-slate-800 dark:text-zinc-100 ${isCompleted ? 'line-through text-slate-500 dark:text-zinc-400' : ''}">${goal.title}</h3>
                ${goal.description ? `<p class="text-xs text-slate-600 dark:text-zinc-400 mt-0.5 break-words">${goal.description}</p>` : ''}
              </div>

              <!-- Circular Progress Ring (Donut Ring) -->
              <div id="progress-container-${goal.id}" class="relative flex-shrink-0 flex items-center justify-center w-16 h-16 ml-1 transition-transform duration-300">
                <svg class="w-16 h-16 transform -rotate-90 overflow-visible" viewBox="0 0 68 68">
                  <!-- Background track circle -->
                  <circle
                    cx="34" cy="34" r="${radius}"
                    stroke-width="6"
                    class="stroke-slate-100 dark:stroke-zinc-800 fill-none"
                  />
                  <!-- Progress animated circle -->
                  <circle
                    id="ring-circle-${goal.id}"
                    cx="34" cy="34" r="${radius}"
                    stroke-width="6"
                    stroke-linecap="round"
                    stroke-dasharray="${circumference}"
                    stroke-dashoffset="${strokeDashoffset}"
                    class="progress-bar-fill fill-none ${isCompleted ? 'stroke-emerald-500' : 'stroke-purple-600'}"
                  />
                </svg>
                <!-- Percentage central text -->
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none">
                  <span id="progress-text-${goal.id}" data-current="${progress}" class="text-xs font-black tracking-tighter ${isCompleted ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-800 dark:text-zinc-100'}">${progress}%</span>
                </div>
              </div>

              <!-- Actions Dropdown / Menu -->
              <div class="flex items-center gap-0.5">
                <button onclick="openGoalModal('${goal.id}')" class="p-1.5 text-slate-400 hover:text-purple-600 dark:hover:text-purple-400 rounded-lg">
                  <span class="material-symbols-outlined text-xl">edit</span>
                </button>
                <button onclick="deleteGoal('${goal.id}')" class="p-1.5 text-slate-400 hover:text-rose-500 rounded-lg">
                  <span class="material-symbols-outlined text-xl">delete</span>
                </button>
              </div>
            </div>

            <!-- Task Checklist Section -->
            ${goal.tasks && goal.tasks.length > 0 ? `
              <div class="mt-3 pt-3 border-t border-slate-100 dark:border-zinc-800/80 space-y-2">
                ${goal.tasks.map((task, idx) => `
                  <label class="flex items-center gap-2.5 cursor-pointer text-xs group">
                    <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTaskCompletion('${goal.id}', ${idx})" class="w-4 h-4 rounded border-slate-300 text-purple-600 focus:ring-purple-500 dark:border-zinc-700 dark:bg-zinc-800 accent-purple-600">
                    <span class="text-slate-700 dark:text-zinc-300 group-hover:text-slate-900 dark:group-hover:text-zinc-100 ${task.completed ? 'line-through text-slate-400 dark:text-zinc-500' : ''}">
                      ${task.text}
                    </span>
                  </label>
                `).join('')}
              </div>
            ` : ''}

            <!-- Completion Date Badge -->
            ${isCompleted && goal.completedAt ? `
              <div class="mt-3 pt-2 border-t border-slate-100 dark:border-zinc-800/60 flex items-center justify-end gap-1 text-[11px] font-medium text-emerald-600 dark:text-emerald-400">
                <span class="material-symbols-outlined text-xs">check_circle</span>
                Concluído em: ${formatDateTime(goal.completedAt)}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      initDragAndDrop();
    }

    function initDragAndDrop() {
      const listEl = document.getElementById('goals-list');
      if (!listEl || typeof Sortable === 'undefined') return;

      if (sortableInstance) {
        sortableInstance.destroy();
      }

      sortableInstance = new Sortable(listEl, {
        handle: '.drag-handle',
        animation: 150,
        ghostClass: 'sortable-ghost',
        dragClass: 'sortable-drag',
        onEnd: function (evt) {
          const itemElements = Array.from(listEl.children);
          const reorderedIds = itemElements.map(el => el.getAttribute('data-id')).filter(Boolean);

          // Reorder global goals list
          const reorderedGoals = [];
          reorderedIds.forEach(id => {
            const found = goals.find(g => g.id === id);
            if (found) reorderedGoals.push(found);
          });

          // Add any remaining goals not currently visible in filter
          goals.forEach(g => {
            if (!reorderedGoals.some(rg => rg.id === g.id)) {
              reorderedGoals.push(g);
            }
          });

          goals = reorderedGoals;
          saveData();
        }
      });
    }

    // --- Task & Goal Logic ---
    function animateValue(element, start, end, duration) {
      if (!element) return;
      if (start === end) {
        element.textContent = end + '%';
        element.dataset.current = end;
        return;
      }

      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        const currentVal = Math.floor(progress * (end - start) + start);
        element.textContent = currentVal + '%';
        if (progress < 1) {
          window.requestAnimationFrame(step);
        } else {
          element.textContent = end + '%';
          element.dataset.current = end;
        }
      };
      window.requestAnimationFrame(step);
    }

    function toggleTaskCompletion(goalId, taskIndex) {
      const goal = goals.find(g => g.id === goalId);
      if (!goal || !goal.tasks[taskIndex]) return;

      const prevProgress = calculateGoalProgress(goal);
      goal.tasks[taskIndex].completed = !goal.tasks[taskIndex].completed;
      const newProgress = calculateGoalProgress(goal);

      // Check if it just reached 100%
      if (newProgress === 100 && prevProgress < 100) {
        goal.completedAt = new Date().toISOString();
        triggerConfetti();
      } else if (newProgress < 100) {
        goal.completedAt = null;
      }

      saveData();

      // Find SVG element and progress text element to animate smoothly in-place
      const circleEl = document.getElementById(`ring-circle-${goalId}`);
      const textEl = document.getElementById(`progress-text-${goalId}`);
      const ringContainer = document.getElementById(`progress-container-${goalId}`);

      if (circleEl && textEl) {
        const radius = 28;
        const circumference = 2 * Math.PI * radius;
        const newOffset = circumference - (newProgress / 100) * circumference;

        // Animate stroke color
        if (newProgress === 100) {
          circleEl.classList.remove('stroke-purple-600');
          circleEl.classList.add('stroke-emerald-500');
          textEl.classList.remove('text-slate-800', 'dark:text-zinc-100');
          textEl.classList.add('text-emerald-600', 'dark:text-emerald-400');
          
          if (ringContainer) {
            ringContainer.classList.remove('animate-ring-pulse');
            // Trigger reflow to restart CSS animation
            void ringContainer.offsetWidth;
            ringContainer.classList.add('animate-ring-pulse');
          }
        } else {
          circleEl.classList.remove('stroke-emerald-500');
          circleEl.classList.add('stroke-purple-600');
          textEl.classList.remove('text-emerald-600', 'dark:text-emerald-400');
          textEl.classList.add('text-slate-800', 'dark:text-zinc-100');
          if (ringContainer) {
            ringContainer.classList.remove('animate-ring-pulse');
          }
        }

        // Animate stroke fill offset via CSS transition
        circleEl.style.strokeDashoffset = newOffset;

        // Animate counter text numeric increment/decrement
        const startVal = parseInt(textEl.dataset.current || prevProgress, 10);
        animateValue(textEl, startVal, newProgress, 600);

        // Delayed re-render to update completed status tabs, checkboxes line-through, and timestamp badges
        setTimeout(() => {
          renderGoals();
        }, 600);
      } else {
        renderGoals();
      }
    }

    function deleteGoal(goalId) {
      if (!confirm('Tem certeza que deseja excluir esta meta?')) return;
      goals = goals.filter(g => g.id !== goalId);
      saveData();
      renderGoals();
    }

    // --- Modal Functions ---
    function openGoalModal(goalId = null) {
      const modal = document.getElementById('goal-modal');
      const title = document.getElementById('modal-title');
      const goalIdInput = document.getElementById('modal-goal-id');
      const titleInput = document.getElementById('goal-title');
      const descInput = document.getElementById('goal-desc');
      const categorySelect = document.getElementById('goal-category');
      const deadlineInput = document.getElementById('goal-deadline');
      const tasksContainer = document.getElementById('modal-tasks-container');

      if (!modal) return;

      // Populate Categories select
      if (categorySelect) {
        categorySelect.innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      }

      if (goalId) {
        const goal = goals.find(g => g.id === goalId);
        if (!goal) return;
        if (title) title.innerText = 'Editar Meta';
        if (goalIdInput) goalIdInput.value = goal.id;
        if (titleInput) titleInput.value = goal.title;
        if (descInput) descInput.value = goal.description || '';
        if (categorySelect) categorySelect.value = goal.categoryId || (categories[0] ? categories[0].id : '');
        if (deadlineInput) deadlineInput.value = goal.deadline || '';
        
        if (tasksContainer) {
          tasksContainer.innerHTML = '';
          (goal.tasks || []).forEach(task => addModalTaskInput(task.text));
        }
      } else {
        if (title) title.innerText = 'Nova Meta';
        if (goalIdInput) goalIdInput.value = '';
        if (titleInput) titleInput.value = '';
        if (descInput) descInput.value = '';
        if (deadlineInput) deadlineInput.value = '';
        if (tasksContainer) {
          tasksContainer.innerHTML = '';
          addModalTaskInput(); // Add one default empty input
        }
      }

      modal.classList.remove('hidden');
    }

    function closeGoalModal() {
      const modal = document.getElementById('goal-modal');
      if (modal) modal.classList.add('hidden');
    }

    function addModalTaskInput(value = '') {
      const tasksContainer = document.getElementById('modal-tasks-container');
      if (!tasksContainer) return;

      const taskDiv = document.createElement('div');
      taskDiv.className = 'flex items-center gap-2 modal-task-item';
      taskDiv.innerHTML = `
        <span class="material-symbols-outlined text-slate-400 dark:text-zinc-500 cursor-grab">drag_handle</span>
        <input type="text" value="${value.replace(/"/g, '&quot;')}" placeholder="Descreva a tarefa..." class="flex-1 px-3 py-2 text-sm bg-slate-100 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 dark:text-zinc-100">
        <button type="button" onclick="this.parentElement.remove()" class="p-1.5 text-slate-400 hover:text-rose-500 rounded-lg">
          <span class="material-symbols-outlined text-lg">close</span>
        </button>
      `;
      tasksContainer.appendChild(taskDiv);
    }

    function handleGoalFormSubmit(e) {
      e.preventDefault();
      const goalIdInput = document.getElementById('modal-goal-id');
      const titleInput = document.getElementById('goal-title');
      const descInput = document.getElementById('goal-desc');
      const categorySelect = document.getElementById('goal-category');
      const deadlineInput = document.getElementById('goal-deadline');

      const goalId = goalIdInput ? goalIdInput.value : '';
      const title = titleInput ? titleInput.value.trim() : '';
      const description = descInput ? descInput.value.trim() : '';
      const categoryId = categorySelect ? categorySelect.value : '';
      const deadline = deadlineInput ? deadlineInput.value : '';

      if (!title) return;

      const taskInputs = document.querySelectorAll('#modal-tasks-container .modal-task-item input');
      const tasks = Array.from(taskInputs)
        .map(input => input.value.trim())
        .filter(text => text.length > 0)
        .map(text => {
          if (goalId) {
            const existingGoal = goals.find(g => g.id === goalId);
            const existingTask = existingGoal ? existingGoal.tasks.find(t => t.text === text) : null;
            if (existingTask) return existingTask;
          }
          return { text, completed: false };
        });

      if (goalId) {
        const goalIndex = goals.findIndex(g => g.id === goalId);
        if (goalIndex !== -1) {
          const prevCompletedAt = goals[goalIndex].completedAt;
          goals[goalIndex] = {
            ...goals[goalIndex],
            title,
            description,
            categoryId,
            deadline,
            tasks
          };
          const newProgress = calculateGoalProgress(goals[goalIndex]);
          if (newProgress === 100 && !prevCompletedAt) {
            goals[goalIndex].completedAt = new Date().toISOString();
          } else if (newProgress < 100) {
            goals[goalIndex].completedAt = null;
          }
        }
      } else {
        const newGoal = {
          id: Date.now().toString(),
          title,
          description,
          categoryId,
          deadline,
          tasks,
          createdAt: new Date().toISOString(),
          completedAt: null
        };
        const newProgress = calculateGoalProgress(newGoal);
        if (newProgress === 100) {
          newGoal.completedAt = new Date().toISOString();
        }
        goals.unshift(newGoal);
      }

      saveData();
      closeGoalModal();
      renderGoals();
    }

    // --- Category Management ---
    function openCategoryModal() {
      renderCategoryList();
      const modal = document.getElementById('category-modal');
      if (modal) modal.classList.remove('hidden');
    }

    function closeCategoryModal() {
      const modal = document.getElementById('category-modal');
      if (modal) modal.classList.add('hidden');
    }

    function renderCategoryList() {
      const container = document.getElementById('category-list');
      if (!container) return;

      container.innerHTML = categories.map(cat => `
        <div class="flex items-center justify-between p-2.5 bg-slate-100 dark:bg-zinc-800 rounded-xl">
          <div class="flex items-center gap-2">
            <span class="w-4 h-4 rounded-full" style="background-color: ${cat.color}"></span>
            <span class="text-sm font-medium text-slate-800 dark:text-zinc-200">${cat.name}</span>
          </div>
          ${categories.length > 1 ? `
            <button onclick="deleteCategory('${cat.id}')" class="p-1 text-slate-400 hover:text-rose-500 rounded-lg">
              <span class="material-symbols-outlined text-lg">delete</span>
            </button>
          ` : ''}
        </div>
      `).join('');
    }

    function handleAddCategory(e) {
      e.preventDefault();
      const nameInput = document.getElementById('new-cat-name');
      const colorInput = document.getElementById('new-cat-color');
      const name = nameInput ? nameInput.value.trim() : '';
      const color = colorInput ? colorInput.value : '#6750A4';

      if (!name) return;

      categories.push({
        id: 'cat_' + Date.now(),
        name,
        color
      });

      saveData();
      if (nameInput) nameInput.value = '';
      renderCategoryList();
      renderCategoryFilters();
      renderGoals();
    }

    function deleteCategory(catId) {
      if (categories.length <= 1) return;
      categories = categories.filter(c => c.id !== catId);
      // Reassign goals with deleted category to first category
      goals.forEach(g => {
        if (g.categoryId === catId) {
          g.categoryId = categories[0].id;
        }
      });
      saveData();
      renderCategoryList();
      renderCategoryFilters();
      renderGoals();
    }

    // --- Confetti Effect ---
    function triggerConfetti() {
      try {
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 80,
            spread: 70,
            origin: { y: 0.6 }
          });
        }
      } catch (err) {
        console.log('Confetti failed to launch', err);
      }
    }

    // --- Filter Handlers ---
    function setupFilterListeners() {
      document.querySelectorAll('.status-filter').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.status-filter').forEach(b => {
            b.classList.remove('bg-purple-600', 'text-white', 'shadow-sm');
            b.classList.add('text-slate-600', 'dark:text-zinc-400');
          });
          const target = e.currentTarget;
          target.classList.add('bg-purple-600', 'text-white', 'shadow-sm');
          target.classList.remove('text-slate-600', 'dark:text-zinc-400');
          currentStatusFilter = target.dataset.status;
          renderGoals();
        });
      });
    }

    // --- Initialization ---
    window.onload = function() {
      initTheme();
      loadData();
      setupFilterListeners();

      // Form Submissions with safety checks
      const goalForm = document.getElementById('goal-form');
      if (goalForm) {
        goalForm.addEventListener('submit', handleGoalFormSubmit);
      }

      const categoryForm = document.getElementById('category-form');
      if (categoryForm) {
        categoryForm.addEventListener('submit', handleAddCategory);
      }

      // Render initial view
      renderCategoryFilters();
      renderGoals();
    };
  </script>
</body>
</html>
